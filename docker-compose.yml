services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dataguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dataguard}
      POSTGRES_DB: ${POSTGRES_DB:-dataguard}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # L'API attend que la base réponde vraiment, pas seulement que le
      # conteneur soit lancé.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dataguard}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-dataguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dataguard}
      POSTGRES_DB: ${POSTGRES_DB:-dataguard}
      DATAGUARD_ENV: docker
      DATAGUARD_CORS_ORIGINS: http://localhost:5173
      DATAGUARD_RAW_DIR: /app/data/raw
      DATAGUARD_OTEL_EXPORTER: console
    ports:
      - "8000:8000"
    volumes:
      - raw_data:/app/data/raw
      # En écriture, et non en lecture seule : c'est ce qui permet de régénérer
      # les fichiers de test depuis le conteneur, sans exiger Python sur l'hôte.
      - ./data/sample:/app/data/sample
      - ./scripts:/app/scripts:ro
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build: ./frontend
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"

volumes:
  db_data:
  raw_data:
